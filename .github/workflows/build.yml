name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A44780: ${{ secrets.A44780 }}
          B8E499: ${{ secrets.B8E499 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A44780', '')
          sec_b = os.environ.get('B8E499', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 07edf5284df1d416c7415d3ea5a99468e44e528f4b40ff -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 68d7172e915122b0e5db2ee2c73efe71 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
